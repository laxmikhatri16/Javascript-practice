<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Download UI</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
            background: #f2f2f2;
        }

        .card {
            width: 300px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

       

        .progress-box {
            width: 100%;
            height: 15px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #2ecc71;
            transition: 0.2s;
        }

       
    </style>
</head>

<body>

    <div class="card">
        <h2>Downloading</h2>
<!-- 
        <button id="btn">Start Download</button> -->

        <div class="progress-box">
            <div class="progress-bar" id="bar"></div>
        </div>

        <div class="percent" id="percentText">0%</div>
    </div>

    <script >
        let progess = document.querySelector(".progress-bar");
         let prercentText = document.querySelector("#percentText");
        let count = 0;
        let interval = setInterval(function () {
         if(count <= 99){
            count++;
            progess.style.width= `${count}%`;
            prercentText.textContent=`${count}%`
         }
         else{
            document.querySelector("h2").textContent="Downloaded";
            clearInterval(interval);
         }
        },30)

    </script>
</body>

</html>
