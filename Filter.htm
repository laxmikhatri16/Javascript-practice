<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real time search filter</title>

    <style>
        body {
            background: #220606;
            margin: 0;
            padding: 30px;
            align-items: center;
            height: 100vh;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;

        }

        .cards {
            display: grid;
            width: 100%;
            max-width: 1000px;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;

        }

        .card {
            position: relative;
            width: 200px;
            height: 300px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);

        }

        .inp {
            padding: 12px;
            width: 250px;
            border-radius: 8px;
            border: 2px solid white;
            outline: none;
            background: #100f0f;
            color: #fbf7f7;
            height: 5px;

        }

        .bg-img {
            width: 100%;
            height: 100%;
            object-position: center;
            object-fit: cover;
            top: 0;
            left: 0;
            position: absolute;

        }

        .blurred-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0));
            /* 

            background-size: cover;
            background-position: bottom; */
            /* filter: blur(1px); */
            z-index: 1;
            /* mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0));
            mask-size: 100% 100%;
            mask-repeat: no-repeat;

            -webkit-mask-image: linear-gradient(to top,
                    rgba(0, 0, 0, 0.1),
                    rgba(0, 0, 0, 0));
            -webkit-mask-size: 100% 100%;
            -webkit-mask-repeat: no-repeat;*/
        }

        .content {
            position: absolute;
            left: 20px;
            bottom: 20px;
            color: white;
            z-index: 2;
        }

        .content h3 {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;

        }

        .content p {
            font-size: 14px;
            color: #ddd;
            line-height: 1.4;
            margin: 0;
        }
    </style>
</head>

<body>

    <input type=" text" class=" inp" placeholder=" Search..">
    <div class="message"></div>
    <div class="cards"></div>



    <script>
        const users = [
            {
                name: "laxmi khatri",
                pic: "https://i.pinimg.com/736x/f4/35/85/f4358576ef07465c85f7038eb2e61582.jpg",
                bio: "love nature ba be silent"
            },

            {
                name: " khatri",
                pic: "https://i.pinimg.com/736x/22/fc/1e/22fc1e731bc0f3277acd8c53806a0f48.jpg",
                bio: "love nature ba be si"
            },
            {
                name: "Ruru",
                pic: "https://i.pinimg.com/736x/b9/56/e3/b956e364f55e97544c62d41ad6e3901e.jpg",
                bio: "love nature ba be silent"
            },
            {
                name: "Amrita",
                pic: "https://i.pinimg.com/736x/92/73/64/927364f4f6f13ca054dbebf8c0eda41b.jpg",
                bio: "love nature ba be silent"
            },

            {
                name: "kaira",
                pic: "https://i.pinimg.com/736x/70/f0/fb/70f0fbe3c40f013af556025e444c9207.jpg",
                bio: "love nature ba be silent"
            },

            {
                name: "sarita",
                pic: "https://i.pinimg.com/736x/fb/e3/b5/fbe3b5518f729e1eb2ec4be0a0b0b6c4.jpg",
                bio: "love nature ba be silent"
            },
            {
                name: "Gita",
                pic: "https://i.pinimg.com/736x/61/fc/7b/61fc7baee5fe7256f0753864b648f1dd.jpg",
                bio: "love nature ba be silent"
            },
            {
                name: "girajuj",
                pic: "https://i.pinimg.com/736x/1c/e3/bf/1ce3bff7ff13661c1f23af978e6b94b9.jpg",
                bio: "love nature ba be silent"
            },

        ];

        
        const messageBox = document.querySelector(".message");
        const cardsContainer = document.querySelector(".cards");
        const searchInput = document.querySelector(".inp");
        function showUsers(arr) {
            // Clear existing content safely
            cardsContainer.innerHTML = "";

            messageBox.innerHTML = "";

            if (arr.length === 0) {
                messageBox.innerHTML = `
            <p style="color:white; font-size:18px; margin-top:10px;">
                User Not Found
            </p>
        `;
                return;
            }


            // Industry standard: Use a Fragment to minimize browser reflows
            const fragment = document.createDocumentFragment();

            arr.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";

                // Using innerHTML here for cleaner creation since it's an internal database
                card.innerHTML = `
                    <img src="${item.pic}" alt="${item.name}" class="bg-img" />
                    <div class="blurred-layer"></div>
                    <div class="content">
                        <h3>${item.name}</h3>
                        <p>${item.bio}</p>
                    </div>
                `;
                fragment.appendChild(card);
            });

            // One single DOM injection
            cardsContainer.appendChild(fragment);
        }

        // Initial render
        showUsers(users);

        // Search logic
        searchInput.addEventListener("input", function () {
            const value = searchInput.value.toLowerCase().trim();

            const filteredUsers = users.filter(user =>
                user.name.toLowerCase().includes(value)
            );

            showUsers(filteredUsers);
        });
    </script>
</body>

</html>
